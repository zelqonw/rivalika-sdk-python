name: Publish

# Publishing is a tag decision, not a branch decision.
#
# The GitLab pipeline this replaces was pinned to one literal tag (v1.0.0b1),
# so shipping any later version meant editing CI. Neither that tag nor the
# package ever made it out. `v*` is the rule that was intended.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted publishing: PyPI mints a short-lived credential from this
      # token. There is no API token to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: the tag must match the project metadata
        # A tag that disagrees with pyproject.toml publishes a version nobody
        # asked for, under a name the tag does not describe.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          META="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$META" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml ${META}" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
