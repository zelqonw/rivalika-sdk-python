name: Publish

# Publishing is a tag decision, not a branch decision.
#
# The GitLab pipeline this replaces was pinned to one literal tag (v1.0.0b1),
# so shipping any later version meant editing CI. Neither that tag nor the
# package ever made it out. `v*` is the rule that was intended.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: PyPI
    runs-on: [self-hosted, rivalika, light]
    environment: release
    permissions:
      contents: read
      # Trusted publishing: PyPI mints a short-lived credential from this
      # token. There is no API token to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: the tag must match the project metadata
        # A tag that disagrees with pyproject.toml publishes a version nobody
        # asked for, under a name the tag does not describe.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          META="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "$META" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml ${META}" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  notification-outcome:
    name: Record notification outcome
    continue-on-error: true
    if: always()
    needs: [publish]
    runs-on: [self-hosted, rivalika, light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Write sanitized outcome
        env:
          NOTIFY_KIND: publish
          NOTIFY_VERSION: ${{ github.ref_name }}
          NOTIFY_RELEASE: ${{ github.sha }}
          NOTIFY_OUTCOME: ${{ needs.publish.result == 'success' && 'published' || needs.publish.result == 'failure' && 'failed' || 'unknown' }}
          NOTIFY_STAGE: ${{ needs.publish.result == 'success' && 'complete' || 'package publication' }}
        run: node scripts/notifications/write-outcome.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notification-outcome-${{ github.run_attempt }}-publish
          path: output/notifications/outcome.json
          retention-days: 14
