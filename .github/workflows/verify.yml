name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests and types
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, light]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pytest mypy
      - run: pytest tests
      - run: mypy --follow-imports=skip rivalika_sdk/client.py rivalika_sdk/webhooks.py rivalika_sdk/integration.py

  build:
    name: distribution
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, light]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: clean wheel install
        run: |
          CLEAN_VENV="$RUNNER_TEMP/rivalika-clean"
          rm -rf "$CLEAN_VENV"
          python -m venv "$CLEAN_VENV"
          "$CLEAN_VENV/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$CLEAN_VENV/bin/python" -c "from rivalika_sdk.integration import IntegrationClient; from rivalika_sdk.models.list_envelope import ListEnvelope"

  drift:
    name: generation drift
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, heavy]
    # The SDK is generated, not written. If the committed tree and a fresh
    # generation from the same spec disagree, someone hand-edited generated
    # code and the next sync would silently revert them.
    container:
      image: openapitools/openapi-generator-cli:v7.22.0
      options: --entrypoint ''
    steps:
      # Before the checkout, not after: actions/checkout falls back to
      # downloading a source tarball when git is missing, and a tree with no
      # .git in it cannot be diffed. That failure looks like a git usage
      # error, which is a long way from its cause.
      - name: install git
        run: |
          apt-get update -qq && apt-get install -y -qq git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
      - name: regenerate
        run: openapi-generator-cli generate -c openapi-generator-config.json
      - name: the tree must be unchanged
        run: git diff --exit-code
